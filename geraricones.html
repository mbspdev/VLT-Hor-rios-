<!DOCTYPE html>
<html>
<body>
  <h3>Gerador de Ícones PWA</h3>
  <script>
    function createIcon(size, name) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Fundo
      ctx.fillStyle = '#1B3D2B';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.22);
      ctx.fill();

      // Círculo
      ctx.fillStyle = '#A3D9A5';
      ctx.beginPath();
      ctx.arc(size/2, size/2, size * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Download
      const a = document.createElement('a');
      a.download = name;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    // Executa ao carregar
    window.onload = () => {
      createIcon(192, 'icon-192.png');
      setTimeout(() => createIcon(512, 'icon-512.png'), 500);
    };
  </script>
</body>
</html>
