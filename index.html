<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLT Horários - Metrofor</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 50%, #e0f2f1 100%);
      --primary-green: #2d7a52;
      --primary-green-hover: #225c3e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      --text-main: #1c3829;
      --text-muted: #668071;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 736px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: #a3d9a5;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.05);
    }

    .icon-box svg {
      width: 36px;
      height: 36px;
      fill: var(--primary-green);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-green);
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #000;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Favoritos */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .fav-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .fav-icon {
      width: 64px;
      height: 64px;
      background: #d8ebd9;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .fav-icon svg {
      width: 28px;
      height: 28px;
      fill: #4e7c62;
    }

    .fav-label {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    /* Seleção */
    .select-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .field-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-box label {
      font-weight: 700;
      font-size: 15px;
    }

    .select-wrapper {
      position: relative;
      background: #fff;
      border-radius: 20px;
      border: 1px solid #d0d7d1;
      padding: 12px 10px;
      box-shadow: var(--card-shadow);
    }

    .select-wrapper select {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
      appearance: none;
      cursor: pointer;
    }

    .arrow-icon {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-icon svg {
      width: 24px;
      height: 24px;
      fill: var(--primary-green);
    }

    .btn-main {
      width: 100%;
      background: var(--primary-green);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(45, 122, 82, 0.3);
      transition: background 0.2s;
      text-align: center;
      margin-top: auto;
    }

    .btn-main:hover {
      background: var(--primary-green-hover);
    }

    /* Tela Resultado */
    .result-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: var(--border-radius);
      padding: 24px 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid #e0e0e0;
      text-align: center;
      margin-top: 20px;
    }

    .result-card .station-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .time-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .clock-icon {
      width: 32px;
      height: 32px;
      border: 3px solid #666;
      border-radius: 50%;
      display: inline-block;
      position: relative;
    }

    .clock-icon::after {
      content: '';
      width: 2px;
      height: 9px;
      background: #666;
      position: absolute;
      top: 4px;
      left: 12px;
    }

    .big-time {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .time-subtext {
      font-size: 14px;
      color: #666;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .direction-info {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--primary-green);
    }

    .next-time-info {
      font-size: 14px;
      color: #444;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 2C8 2 4 2.5 4 6v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.71 0 5.13.43 6 1H6c.87-.57 2.29-1 6-1zm6 7H6V7h12v4zm-10.5 6c-.83 0-1.5-.67-1.5-1.5S6.67 12 7.5 12s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      </div>
      <h1>VLT Horários</h1>
    </div>

    <!-- TELA 1: Seleção de Estação -->
    <div id="screen-search" class="screen">
      <div>
        <div class="section-title">Favoritos</div>
        <div class="favorites-grid">
          <div class="fav-card" onclick="quickSelect('PARANGABA', 'PAPICU')">
            <div class="fav-icon">
              <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
            </div>
            <span class="fav-label">Parangaba</span>
          </div>
          <div class="fav-card" onclick="quickSelect('PAPICU', 'IATE')">
            <div class="fav-icon">
              <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </div>
            <span class="fav-label">Papicu</span>
          </div>
          <div class="fav-card" onclick="quickSelect('IATE', 'PARANGABA')">
            <div class="fav-icon">
              <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <span class="fav-label">Iate</span>
          </div>
        </div>

        <div class="section-title">Estações</div>
        <div class="select-group">
          <div class="field-box">
            <label>De:</label>
            <div class="select-wrapper">
              <select id="select-origin">
                <option value="" disabled selected>Selecione Estação</option>
              </select>
            </div>
          </div>

          <div class="arrow-icon">
            <svg viewBox="0 0 24 24"><path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/></svg>
          </div>

          <div class="field-box">
            <label>Para:</label>
            <div class="select-wrapper">
              <select id="select-destination">
                <option value="" disabled selected>Selecione Estação</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-main" onclick="calculateNextTrain()">Ver próximo horário</button>
    </div>

    <!-- TELA 2: Exibição do Próximo Horário -->
    <div id="screen-result" class="screen hidden">
      <div>
        <div class="section-title">Próximo Horário</div>
        <div class="result-card">
          <div class="station-name" id="result-station-name">Na Estação Parangaba (VLT)</div>
          
          <div class="time-display">
            <div class="clock-icon"></div>
            <span class="big-time" id="result-main-time">--:--</span>
          </div>
          <div class="time-subtext" id="result-subtext">Partida em -- min</div>

          <div class="direction-info" id="result-direction">Sentido [IATE]</div>
          <div class="next-time-info" id="result-following-time">Seguinte: --:--</div>
        </div>
      </div>

      <button class="btn-main" onclick="showScreen('search')">Voltar</button>
    </div>
  </div>

        "B. DE MELO": ["05:42", "06:20", "06:58", "07:40", "08:20", "09:01", "09:42", "10:22", "11:03", "11:43", "12:23", "13:03", "13:43", "14:23", "15:03", "15:43", "16:23", "17:03", "17:43", "18:23", "19:03", "19:40", "20:18", "20:56", "21:32", "22:09", "22:46"],
        "S.J. DO TAUAPE": ["05:46", "06:24", "07:02", "07:44", "08:24", "09:05", "09:46", "10:26", "11:07", "11:47", "12:27", "13:07", "13:47", "14:27", "15:07", "15:47", "16:27", "17:07", "17:47", "18:27", "19:07", "19:44", "20:22", "21:00", "21:36", "22:13", "22:50"],
        "PONTES VIEIRA": ["05:51", "06:29", "07:07", "07:49", "08:29", "09:10", "09:51", "10:31", "11:12", "11:52", "12:32", "13:12", "13:52", "14:32", "15:12", "15:52", "16:32", "17:12", "17:52", "18:32", "19:12", "19:49", "20:27", "21:05", "21:41", "22:18", "22:55"],
        "ANTONIO SALES": ["05:54", "06:32", "07:10", "07:52", "08:32", "09:13", "09:54", "10:34", "11:15", "11:55", "12:35", "13:15", "13:55", "14:35", "15:15", "15:55", "16:35", "17:15", "17:55", "18:35", "19:15", "19:52", "20:30", "21:08", "21:44", "22:21", "22:58"],
        "PAPICU": ["05:58", "06:36", "07:14", "07:56", "08:36", "09:17", "09:58", "10:38", "11:19", "11:59", "12:39", "13:19", "13:59", "14:39", "15:19", "15:59", "16:39", "17:19", "17:59", "18:39", "19:19", "19:56", "20:34", "21:12", "21:48", "22:25", "23:02"],
        "MUCURIPE": ["06:02", "06:40", "07:18", "08:00", "08:40", "09:21", "10:02", "10:42", "11:23", "12:03", "12:43", "13:23", "14:03", "14:43", "15:23", "16:03", "16:43", "17:23", "18:03", "18:43", "19:23", "20:00", "20:38", "21:16", "21:52", "22:29", "23:06"]
      },
      PARANGABA: {
        "IATE": ["05:30", "06:08", "06:46", "07:26", "08:06", "08:47", "09:28", "10:09", "10:50", "11:30", "12:10", "12:50", "13:30", "14:10", "14:50", "15:30", "16:10", "16:50", "17:30", "18:10", "18:50", "19:28", "20:06", "20:44", "21:21", "21:58", "22:35"],
        "MUCURIPE": ["05:33", "06:11", "06:49", "07:29", "08:09", "08:50", "09:31", "10:12", "10:53", "11:33", "12:13", "12:53", "13:33", "14:13", "14:53", "15:33", "16:13", "16:53", "17:33", "18:13", "18:53", "19:31", "20:09", "20:47", "21:24", "22:01", "22:38"],
        "PAPICU": ["05:37", "06:15", "06:53", "07:33", "08:13", "08:54", "09:35", "10:16", "10:57", "11:37", "12:17", "12:57", "13:37", "14:17", "14:57", "15:37", "16:17", "16:57", "17:37", "18:17", "18:57", "19:35", "20:13", "20:51", "21:28", "22:05", "22:42"],

        "EXPEDICIONARIOS": ["06:00", "06:38", "07:16", "07:57", "08:37", "09:18", "09:59", "10:39", "11:20", "12:00", "12:40", "13:20", "14:00", "14:40", "15:20", "16:00", "16:40", "17:20", "18:00", "18:40", "19:20", "19:58", "20:36", "21:14", "21:50", "22:27", "23:04"],
        "MONTESE": ["06:02", "06:40", "07:18", "08:00", "08:40", "09:21", "10:02", "10:42", "11:23", "12:03", "12:43", "13:23", "14:03", "14:43", "15:23", "16:03", "16:43", "17:23", "18:03", "18:43", "19:23", "20:00", "20:38", "21:16", "21:52", "22:29", "23:06"]
      }
    };

    /* =========================================================================
       INICIALIZAÇÃO DA INTERFACE
       ========================================================================= */
    const originSelect = document.getElementById('select-origin');
    const destSelect = document.getElementById('select-destination');

    function populateSelects() {
      stationsOrder.forEach(station => {
        const opt1 = document.createElement('option');
        opt1.value = station;
        opt1.textContent = station;
        originSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = station;
        opt2.textContent = station;
        destSelect.appendChild(opt2);
      });
    }

    populateSelects();

    function showScreen(screenType) {
      if(screenType === 'result') {
        document.getElementById('screen-search').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
      } else {
        document.getElementById('screen-result').classList.add('hidden');
        document.getElementById('screen-search').classList.remove('hidden');
      }
    }

    function quickSelect(origin, dest) {
      originSelect.value = origin;
      destSelect.value = dest;
    }

    function getBrasiliaDate() {
      const now = new Date();
      const brasiliaString = now.toLocaleString("en-US", {timeZone: "America/Fortaleza"});
      return new Date(brasiliaString);
    }

    /* =========================================================================
       CÁLCULO EXIBINDO O HORÁRIO EXATO DE PARTIDA
       ========================================================================= */
    function calculateNextTrain() {
      const origin = originSelect.value;
      const destination = destSelect.value;

      if (!origin || !destination) {
        alert("Por favor, selecione a estação de origem e de destino.");
        return;
      }

      if (origin === destination) {
        alert("A estação de origem e destino não podem ser iguais.");
        return;
      }

      const originIdx = stationsOrder.indexOf(origin);
      const destIdx = stationsOrder.indexOf(destination);

      const direction = originIdx < destIdx ? "IATE" : "PARANGABA";
      const scheduleList = rawSchedules[direction]?.[origin] || [];

      const now = getBrasiliaDate();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let nextTrainFormatted = null;
      let nextTrainMin = null;
      let followingTrainFormatted = null;

      for (let i = 0; i < scheduleList.length; i++) {
        const timeStr = scheduleList[i];
        const [h, m] = timeStr.split(':').map(Number);
        const trainMinutes = h * 60 + m;

        if (trainMinutes >= currentMinutes) {
          nextTrainFormatted = timeStr;
          nextTrainMin = trainMinutes;

          if (i + 1 < scheduleList.length) {
            followingTrainFormatted = scheduleList[i + 1];
          }
          break;
        }
      }

      document.getElementById('result-station-name').textContent = `Na Estação ${origin} (VLT)`;
      document.getElementById('result-direction').textContent = `Sentido [${direction}]`;

      if (nextTrainFormatted !== null) {
        const diffNext = nextTrainMin - currentMinutes;

        // Mostra o horário exato em destaque principal
        document.getElementById('result-main-time').textContent = nextTrainFormatted;

        // Texto auxiliar com o tempo de espera restante
        if (diffNext === 0) {
          document.getElementById('result-subtext').textContent = "A passar agora na estação";
        } else {
          document.getElementById('result-subtext').textContent = `Partida em ${diffNext} min`;
        }

        if (followingTrainFormatted !== null) {
          document.getElementById('result-following-time').textContent = `Seguinte: ${followingTrainFormatted}`;
        } else {
          document.getElementById('result-following-time').textContent = "Seguinte: Último comboio do dia";
        }
      } else {
        document.getElementById('result-main-time').textContent = "--:--";
        document.getElementById('result-subtext').textContent = "Fora do horário de funcionamento";
        document.getElementById('result-following-time').textContent = "Operação encerrada por hoje";
      }

      showScreen('result');
    }
