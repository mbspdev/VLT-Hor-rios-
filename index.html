<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLT Horários - Metrofor</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 50%, #e0f2f1 100%);
      --primary-green: #2d7a52;
      --primary-green-hover: #225c3e;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      --text-main: #1c3829;
      --text-muted: #668071;
      --island-bg: #1c3829;
      --island-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100dvh;
      max-height: 896px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      justify-content: space-between;
    }

    @media (min-height: 700px) {
      .app-container {
        height: 92dvh;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      }
    }

    /* Topo / Dynamic Island Header */
    .header-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
      margin-bottom: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: #a3d9a5;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 30px;
      height: 30px;
      fill: var(--primary-green);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-green);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #000;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
      position: relative;
      overflow-y: auto;
      padding-bottom: 10px;
    }

    /* Trajetos Recentes */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .fav-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .fav-icon {
      width: 58px;
      height: 58px;
      background: #d8ebd9;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid rgba(255,255,255,0.8);
      transition: transform 0.15s ease;
    }

    .fav-card:active .fav-icon {
      transform: scale(0.95);
    }

    .fav-icon svg {
      width: 28px;
      height: 28px;
      fill: #2d7a52;
    }

    .fav-label {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Seleção */
    .select-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .field-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-box label {
      font-weight: 700;
      font-size: 14px;
    }

    .select-wrapper {
      position: relative;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #d0d7d1;
      padding: 12px 10px;
      box-shadow: var(--card-shadow);
    }

    .select-wrapper select {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
      appearance: none;
      cursor: pointer;
    }

    .arrow-icon {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--primary-green);
    }

    /* Botão Fixo */
    .action-footer {
      width: 100%;
      padding-top: 10px;
      z-index: 10;
    }

    .btn-main {
      width: 100%;
      background: var(--primary-green);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(45, 122, 82, 0.35);
      transition: background 0.2s, transform 0.15s ease;
      text-align: center;
    }

    .btn-main:active {
      transform: scale(0.98);
      background: var(--primary-green-hover);
    }

    /* =========================================================================
       DYNAMIC ISLAND ANIMATED CARD
       ========================================================================= */
    .dynamic-island-container {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) scale(0.2);
      width: 120px;
      height: 36px;
      background: var(--island-bg);
      border-radius: 30px;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      color: var(--island-text);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .dynamic-island-container.expanded {
      top: 50%;
      transform: translate(-50%, -55%) scale(1);
      width: calc(100% - 32px);
      height: auto;
      min-height: 340px;
      border-radius: 28px;
      opacity: 1;
      pointer-events: auto;
    }

    .island-content {
      opacity: 0;
      transition: opacity 0.3s ease 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100%;
      justify-content: space-between;
    }

    .dynamic-island-container.expanded .island-content {
      opacity: 1;
    }

    .island-pill-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #a3d9a5;
      margin-bottom: 12px;
    }

    .island-pill-header svg {
      width: 18px;
      height: 18px;
      fill: #a3d9a5;
    }

    .island-station-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .island-time-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .island-clock-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #a3d9a5;
      border-radius: 50%;
      position: relative;
    }

    .island-clock-icon::after {
      content: '';
      width: 2px;
      height: 8px;
      background: #a3d9a5;
      position: absolute;
      top: 4px;
      left: 11px;
    }

    .island-big-time {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      line-height: 1;
    }

    .island-time-subtext {
      font-size: 13px;
      color: #a3d9a5;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .island-direction-info {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .island-next-time-info {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .overlay-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 90;
    }

    .overlay-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

        </div>
      </div>
    </div>

        </div>

        <div>
          <div class="island-time-display">
            <div class="island-clock-icon"></div>

  </div>

      { origin: "PARANGABA", dest: "PAPICU" },
      { origin: "PAPICU", dest: "IATE" },
      { origin: "IATE", dest: "PARANGABA" }
    ];

    let isIslandOpen = false;

    const originSelect = document.getElementById('select-origin');
    const destSelect = document.getElementById('select-destination');
    const btnAction = document.getElementById('btn-action');

    function populateSelects() {
      stationsOrder.forEach(station => {
        const opt1 = document.createElement('option');
        opt1.value = station;
        opt1.textContent = station;
        originSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = station;
        opt2.textContent = station;
        destSelect.appendChild(opt2);
      });
    }

    function getRecents() {
      const stored = localStorage.getItem('vlt_recents');
      return stored ? JSON.parse(stored) : defaultRecents;
    }

    function saveRecent(origin, dest) {
      let list = getRecents();
      list = list.filter(item => !(item.origin === origin && item.dest === dest));
      list.unshift({ origin, dest });
      if (list.length > 3) list = list.slice(0, 3);
      localStorage.setItem('vlt_recents', JSON.stringify(list));
      renderRecents();
    }

    function renderRecents() {
      const container = document.getElementById('recents-container');
      container.innerHTML = '';
      const recents = getRecents();

      recents.forEach(item => {
        const card = document.createElement('div');
        card.className = 'fav-card';
        card.onclick = () => quickSelect(item.origin, item.dest);
        card.innerHTML = `
          <div class="fav-icon">
            ${vltIconSvg}
          </div>
          <span class="fav-label">${item.origin} → ${item.dest}</span>
        `;
        container.appendChild(card);
      });
    }

    function quickSelect(origin, dest) {
      originSelect.value = origin;
      destSelect.value = dest;
    }

    function getBrasiliaDate() {
      const now = new Date();
      const brasiliaString = now.toLocaleString("en-US", {timeZone: "America/Fortaleza"});
      return new Date(brasiliaString);
    }

    function handleButtonClick() {
      if (!isIslandOpen) {
        calculateAndOpenIsland();
      } else {
        closeIsland();
      }
    }

    function calculateAndOpenIsland() {
      const origin = originSelect.value;
      const destination = destSelect.value;

      if (!origin || !destination) {
        alert("Por favor, selecione a estação de origem e de destino.");
        return;
      }

      if (origin === destination) {
        alert("A estação de origem e destino não podem ser iguais.");
        return;
      }

      saveRecent(origin, destination);

      const originIdx = stationsOrder.indexOf(origin);
      const destIdx = stationsOrder.indexOf(destination);

      const direction = originIdx < destIdx ? "IATE" : "PARANGABA";
      const scheduleList = rawSchedules[direction]?.[origin] || [];

      const now = getBrasiliaDate();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let nextTrainFormatted = null;
      let nextTrainMin = null;
      let followingTrainFormatted = null;

      for (let i = 0; i < scheduleList.length; i++) {
        const timeStr = scheduleList[i];
        const [h, m] = timeStr.split(':').map(Number);
        const trainMinutes = h * 60 + m;

        if (trainMinutes >= currentMinutes) {
          nextTrainFormatted = timeStr;
          nextTrainMin = trainMinutes;

          if (i + 1 < scheduleList.length) {
            followingTrainFormatted = scheduleList[i + 1];
          }
          break;
        }
      }

      document.getElementById('island-station-name').textContent = `Na Estação ${origin}`;
      document.getElementById('island-direction').textContent = `Sentido ${direction}`;

      if (nextTrainFormatted !== null) {
        const diffNext = nextTrainMin - currentMinutes;
        document.getElementById('island-main-time').textContent = nextTrainFormatted;

        if (diffNext === 0) {
          document.getElementById('island-subtext').textContent = "A passar agora na estação";
        } else {
          document.getElementById('island-subtext').textContent = `Partida em ${diffNext} min`;
        }

        if (followingTrainFormatted !== null) {
          document.getElementById('island-following-time').textContent = `Seguinte: ${followingTrainFormatted}`;
        } else {
          document.getElementById('island-following-time').textContent = "Seguinte: Último comboio do dia";
        }
      } else {
        document.getElementById('island-main-time').textContent = "--:--";
        document.getElementById('island-subtext').textContent = "Fora de operação";
        document.getElementById('island-following-time').textContent = "Operação encerrada por hoje";
      }

      // Animar Ilha Dinâmica
      document.getElementById('dynamic-island').classList.add('expanded');
      document.getElementById('backdrop').classList.add('active');
      btnAction.textContent = "Voltar";
      isIslandOpen = true;
    }

    function closeIsland() {
      document.getElementById('dynamic-island').classList.remove('expanded');
      document.getElementById('backdrop').classList.remove('active');
      btnAction.textContent = "Ver próximo horário";
      isIslandOpen = false;
    }

    populateSelects();
    renderRecents();
  </script>
</body>
</html>
